name: Run ML Signal Engine

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes during market hours
  workflow_dispatch:        # Allows manual run anytime

jobs:
  run-trading-bot:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Run Trading Strategy Script
      run: |
        python main.py  # Replace with your main trading bot file name if different

    - name: Commit and Push Updated Trades CSV
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add trades_master.csv
        git commit -m "Auto-update signals and trades log" || exit 0
        git push
